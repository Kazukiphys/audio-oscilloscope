<!DOCTYPE html>
<html>

<head>

  <meta charset="UTF-8">

  <title>Audio Oscilloscope</title>

  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

  <style>

    body{
      margin:0;
      background:white;
      color:black;
      font-family:Arial,sans-serif;
      overflow-x:hidden;
      overflow-y:auto;
    }

    #container{
      width:100vw;
      height:100vh;
      position:relative;
      display:flex;
      flex-direction:column;
      align-items:center;
    }

    h1{
      margin-top:15px;
      margin-bottom:5px;
      font-size:28px;
      font-weight:normal;
    }

    #description{
      font-size:14px;
      color:#444;
      margin-bottom:10px;
    }

    #chartWrapper{
      width:95%;
      height:70%;
      border:1px solid #999;
      background:white;
    }

    #chartCanvas{
      width:100%;
      height:100%;
    }

    #controls{
      margin-top:15px;
    }

    button{
      background:white;
      color:black;
      border:1px solid #999;
      padding:10px 18px;
      margin:0 5px;
      cursor:pointer;
      font-size:15px;
    }

    button:hover{
      background:#f0f0f0;
    }

    #info{
      margin-top:10px;
      font-size:18px;
      color:black;
    }

    #frequency{
      margin-top:6px;
      font-size:18px;
      color:black;
    }

    #status{
      margin-top:8px;
      color:#444;
      font-size:14px;
    }

    .credit{
      position:absolute;
      top:12px;
      right:18px;
      font-size:12px;
      color:#666;
      font-style:italic;
    }

  </style>

</head>

<body>

<div id="container">

  <div class="credit">
    by K.Kitaoka
  </div>

  <h1>
    音の波形観察（オシロスコープ）
  </h1>

  <div id="description">
    横軸：時間　／　縦軸：振幅
  </div>

  <div id="chartWrapper">
    <canvas id="chartCanvas"></canvas>
  </div>

  <div id="controls">

    <button onclick="startAudio()">
      Start
    </button>

    <button onclick="stopAudio()">
      Stop
    </button>

    <button onclick="downloadPNG()">
      Download PNG
    </button>

    <button onclick="downloadCSV()">
      Download CSV
    </button>

  </div>

  <div id="info">
    Amplitude : ---
  </div>

  <div id="frequency">
    Frequency : ---
  </div>

  <div id="status">
    Ready
  </div>

</div>

<script>

let audioContext;
let analyser;
let microphone;
let dataArray;
let animationId;
let chart;
let stream;

let lastWaveData = [];
let amplitudeScale = 0.05;
let amplitudeScaleManual = false;
let audioPaused = true;
let dragAxis = null;
let previousPointerX = 0;
let previousPointerY = 0;
let selectingPeriod = false;
let periodStartMs = null;
let periodEndMs = null;

const fftSize = 2048;

const ctx =
  document.getElementById('chartCanvas')
  .getContext('2d');

function createChart(){

  chart = new Chart(ctx, {

    type:'line',

    data:{
      datasets:[{

        label:'Waveform',

        data:[],

        borderColor:'#000',

        borderWidth:1.5,

        pointRadius:0,

        tension:0
      }]
    },

    plugins:[{

      id:'periodSelection',

      beforeDatasetsDraw:function(chart){

        if(periodStartMs === null || periodEndMs === null){
          return;
        }

        const area = chart.chartArea;
        const startX = chart.scales.x.getPixelForValue(periodStartMs);
        const endX = chart.scales.x.getPixelForValue(periodEndMs);
        const left = Math.max(area.left, Math.min(startX, endX));
        const right = Math.min(area.right, Math.max(startX, endX));
        const context = chart.ctx;

        if(right <= left){
          return;
        }

        context.save();
        context.fillStyle = 'rgba(0,120,215,0.16)';
        context.fillRect(left, area.top, right - left, area.bottom - area.top);
        context.strokeStyle = 'rgba(0,90,170,0.9)';
        context.lineWidth = 1;
        context.beginPath();
        context.moveTo(startX, area.top);
        context.lineTo(startX, area.bottom);
        context.moveTo(endX, area.top);
        context.lineTo(endX, area.bottom);
        context.stroke();
        context.restore();
      }
    }],

    options:{

      responsive:true,

      maintainAspectRatio:false,

      animation:false,

      parsing:false,

      interaction:{
        intersect:false,
        mode:'nearest'
      },

      plugins:{

        legend:{
          display:false
        },

        tooltip:{

          enabled:true,

          callbacks:{

            label:function(context){

              return (
                context.raw.x.toFixed(2) +
                ' ms : ' +
                context.raw.y.toFixed(3)
              );
            }
          }
        }
      },

      scales:{

        x:{

          type:'linear',

          min:0,

          max:50,

          title:{
            display:true,
            text:'Time [ms]',
            color:'#000',
            font:{
              size:18
            }
          },

          ticks:{
            color:'#000'
          },

          grid:{
            color:'rgba(0,0,0,0.1)'
          }
        },

        y:{

          min:-amplitudeScale,

          max:amplitudeScale,

          title:{
            display:true,
            text:'Amplitude',
            color:'#000',
            font:{
              size:18
            }
          },

          ticks:{
            color:'#000'
          },

          grid:{
            color:'rgba(0,0,0,0.1)'
          }
        }
      }
    }
  });
}

createChart();
setupAxisScaling();

function setupAxisScaling(){

  const canvas = chart.canvas;

  function getPosition(event){

    const rect = canvas.getBoundingClientRect();

    return {
      x:(event.clientX - rect.left) * chart.width / rect.width,
      y:(event.clientY - rect.top) * chart.height / rect.height
    };
  }

  function getAxis(position){

    const xScale = chart.scales.x;
    const yScale = chart.scales.y;

    if(
      position.x >= chart.chartArea.left &&
      position.x <= chart.chartArea.right &&
      position.y >= xScale.top &&
      position.y <= xScale.bottom
    ){
      return 'x';
    }

    if(
      position.x >= yScale.left &&
      position.x <= yScale.right &&
      position.y >= chart.chartArea.top &&
      position.y <= chart.chartArea.bottom
    ){
      return 'y';
    }

    return null;
  }

  function getTimeAtPosition(position){

    const x = Math.max(
      chart.chartArea.left,
      Math.min(chart.chartArea.right, position.x)
    );

    return chart.scales.x.getValueForPixel(x);
  }

  function showSelectedFrequency(){

    const periodMs = Math.abs(periodEndMs - periodStartMs);

    if(periodMs <= 0){
      document.getElementById('frequency').innerHTML =
        'Frequency : ---';
      return;
    }

    document.getElementById('frequency').innerHTML =
      'Frequency : ' +
      (1000 / periodMs).toFixed(2) +
      ' Hz (Period: ' +
      periodMs.toFixed(2) +
      ' ms)';
  }

  canvas.addEventListener('pointermove',event=>{

    if(selectingPeriod && audioPaused){

      periodEndMs =
        getTimeAtPosition(getPosition(event));

      chart.update('none');
      return;
    }

    if(dragAxis){

      if(!audioPaused && dragAxis !== 'y'){
        dragAxis = null;
        canvas.style.cursor = 'default';
        return;
      }

      const pointerPosition =
        dragAxis === 'x' ? event.clientX : event.clientY;

      const previousPointerPosition =
        dragAxis === 'x' ? previousPointerX : previousPointerY;

      const factor = Math.exp(
        -(pointerPosition - previousPointerPosition) * 0.01
      );

      if(dragAxis === 'x'){
        previousPointerX = event.clientX;
      }else{
        previousPointerY = event.clientY;
      }

      if(dragAxis === 'x'){

        const xScale = chart.options.scales.x;
        const range = Math.max(
          1,
          Math.min(500, (xScale.max - xScale.min) * factor)
        );

        xScale.max = xScale.min + range;

      }else{

        amplitudeScaleManual = true;
        amplitudeScale = Math.max(
          0.005,
          Math.min(2, amplitudeScale * factor)
        );

        chart.options.scales.y.min = -amplitudeScale;
        chart.options.scales.y.max = amplitudeScale;
      }

      chart.update('none');
      canvas.style.cursor =
        dragAxis === 'y' ? 'ns-resize' : 'ew-resize';
      return;
    }

    const axis = getAxis(getPosition(event));

    canvas.style.cursor =
      axis === 'y' ? 'ns-resize' :
      audioPaused && axis === 'x' ? 'ew-resize' :
      audioPaused && lastWaveData.length > 0 &&
        positionInChartArea(getPosition(event)) ? 'crosshair' :
      'default';
  });

  canvas.addEventListener('pointerdown',event=>{

    const position = getPosition(event);
    const axis = getAxis(position);

    if(!audioPaused && axis !== 'y'){
      return;
    }

    if(
      audioPaused &&
      !axis &&
      lastWaveData.length > 0 &&
      positionInChartArea(position)
    ){
      selectingPeriod = true;
      periodStartMs = getTimeAtPosition(position);
      periodEndMs = periodStartMs;
      canvas.setPointerCapture(event.pointerId);
      canvas.style.cursor = 'crosshair';
      chart.update('none');
      return;
    }

    dragAxis = axis;

    if(dragAxis){
      previousPointerX = event.clientX;
      previousPointerY = event.clientY;
      canvas.setPointerCapture(event.pointerId);
      canvas.style.cursor =
        dragAxis === 'y' ? 'ns-resize' : 'ew-resize';
    }
  });

  canvas.addEventListener('pointerup',()=>{

    if(selectingPeriod){
      selectingPeriod = false;
      showSelectedFrequency();
      chart.update('none');
    }

    dragAxis = null;
  });

  function positionInChartArea(position){

    return (
      position.x >= chart.chartArea.left &&
      position.x <= chart.chartArea.right &&
      position.y >= chart.chartArea.top &&
      position.y <= chart.chartArea.bottom
    );
  }
}

async function startAudio(){

  try{

    document.getElementById('status')
      .innerHTML =
      'Requesting microphone...';

    if(audioContext){
      return;
    }

    stream =
      await navigator.mediaDevices.getUserMedia({

        audio:{

          echoCancellation:false,
          noiseSuppression:false,
          autoGainControl:false

        }
      });

    audioContext =
      new (
        window.AudioContext ||
        window.webkitAudioContext
      )();

    await audioContext.resume();

    analyser =
      audioContext.createAnalyser();

    analyser.fftSize = fftSize;

    microphone =
      audioContext.createMediaStreamSource(stream);

    microphone.connect(analyser);

    dataArray =
      new Float32Array(
        analyser.fftSize
      );

    document.getElementById('status')
      .innerHTML =
      'Microphone connected';

    selectingPeriod = false;
    periodStartMs = null;
    periodEndMs = null;
    document.getElementById('frequency').innerHTML =
      'Frequency : ---';
    audioPaused = false;
    amplitudeScaleManual = false;
    chart.update('none');
    updateWaveform();

  }catch(error){

    console.error(error);

    document.getElementById('status')
      .innerHTML =
      'Error : ' + error.name;

    alert(
      'マイクが使用できません。\n\n' +
      error.name +
      '\n\n' +
      error.message
    );
  }
}

function updateWaveform(){

  analyser.getFloatTimeDomainData(dataArray);

  const sampleRate =
    audioContext.sampleRate;

  const points = [];

  let peakAmplitude = 0;

  for(let i=0;i<dataArray.length;i++){

    const timeMs =
      i / sampleRate * 1000;

    const amp =
      dataArray[i];

    points.push({

      x:timeMs,

      y:amp
    });

    if(Math.abs(amp) > peakAmplitude){

      peakAmplitude =
        Math.abs(amp);
    }
  }

  lastWaveData = points;

  const targetScale =
    Math.max(peakAmplitude * 1.2, 0.05);

  if(!amplitudeScaleManual){
    amplitudeScale =
      Math.max(amplitudeScale, targetScale);
  }

  chart.options.scales.y.min =
    -amplitudeScale;

  chart.options.scales.y.max =
    amplitudeScale;

  chart.data.datasets[0].data =
    points;

  chart.update();

  document.getElementById('info')
    .innerHTML =
    'Peak Amplitude : ' +
    peakAmplitude.toFixed(3);

  animationId =
    requestAnimationFrame(updateWaveform);
}

function stopAudio(){

  audioPaused = true;
  cancelAnimationFrame(animationId);

  if(stream){

    stream.getTracks()
      .forEach(track=>{
        track.stop();
      });
  }

  if(audioContext){

    audioContext.close();
  }

  audioContext = null;

  document.getElementById('status')
    .innerHTML =
    'Stopped';
}

function downloadPNG(){

  const originalCanvas =
    document.getElementById('chartCanvas');

  const exportCanvas =
    document.createElement('canvas');

  exportCanvas.width =
    originalCanvas.width;

  exportCanvas.height =
    originalCanvas.height;

  const exportCtx =
    exportCanvas.getContext('2d');

  exportCtx.fillStyle =
    'white';

  exportCtx.fillRect(
    0,
    0,
    exportCanvas.width,
    exportCanvas.height
  );

  exportCtx.drawImage(
    originalCanvas,
    0,
    0
  );

  const link =
    document.createElement('a');

  link.download =
    'waveform.png';

  link.href =
    exportCanvas.toDataURL(
      'image/png'
    );

  link.click();
}

function downloadCSV(){

  if(lastWaveData.length === 0){

    alert('データがありません。');

    return;
  }

  let csv =
    'Time[ms],Amplitude\n';

  lastWaveData.forEach(point=>{

    csv +=
      point.x.toFixed(5) +
      ',' +
      point.y.toFixed(5) +
      '\n';
  });

  const blob =
    new Blob(
      [csv],
      {type:'text/csv'}
    );

  const url =
    URL.createObjectURL(blob);

  const link =
    document.createElement('a');

  link.href = url;

  link.download =
    'waveform_data.csv';

  link.click();

  URL.revokeObjectURL(url);
}

</script>

</body>
</html>
